name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compiler avec Maven (mvn clean package)
        run: mvn -B clean package

      - name: Publier le jar compile (artifact du run, expire au bout de 90 jours)
        uses: actions/upload-artifact@v4
        with:
          name: MysteriaCraft-jar
          # maven-shade-plugin garde aussi l'archive non-shadee sous "original-*.jar" : on ne
          # publie que le jar final (avec sqlite-jdbc embarque) pour eviter toute confusion.
          path: |
            target/*.jar
            !target/original-*.jar
          if-no-files-found: error

      - name: Empaqueter le resource pack (textures des items custom)
        run: |
          cd resourcepack
          zip -r ../MysteriaCraft-resourcepack.zip . -x '.*'
          cd ..

      - name: Publier une Release GitHub avec le jar (lien stable, sans connexion requise)
        # Uniquement sur un push (pas sur les runs "pull_request", qui tournent sur une fusion
        # ephemere non poussee) : le tag "latest-build" est deplace et sa Release mise a jour a
        # chaque nouveau commit, pour toujours pointer vers le jar le plus recent. Le resource
        # pack est publie dans la meme Release, sous un nom stable (voir resourcepack.yml).
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls target/*.jar | grep -v '/original-' | head -n1)
          gh release delete latest-build --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest-build "$JAR" MysteriaCraft-resourcepack.zip \
            --repo "${{ github.repository }}" \
            --title "MysteriaCraft - dernier build" \
            --notes "Build automatique depuis la branche \`${{ github.ref_name }}\`, commit ${{ github.sha }}." \
            --prerelease
