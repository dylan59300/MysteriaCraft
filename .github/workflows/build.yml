name: Build mod jar

on:
  workflow_dispatch:
  push:
    branches:
      - claude/beautiful-clarke-xkgjv1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: mysteriacraft-jar
          path: build/libs/*.jar
          retention-days: 14

      - name: Publish jar to ci-jar-output branch
        run: |
          JAR=$(ls build/libs/*.jar | grep -v sources | head -n1)
          mkdir /tmp/publish
          cp "$JAR" /tmp/publish/mysteriacraft.jar
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-jar-output
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/publish/mysteriacraft.jar .
          git add mysteriacraft.jar
          git commit -m "CI build from ${{ github.sha }}"
          git push -f origin HEAD:ci-jar-output
