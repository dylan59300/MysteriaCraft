# =========================================
#   MysteriaCraft - Configuration du module Iles (Skyblock)
# =========================================
# Chaque joueur peut creer UNE ile privee (voir /ile create) dans un monde dedie, entierement
# vide (void), genere automatiquement au demarrage du plugin si absent. Les iles sont alignees le
# long de l'axe X, espacees de "espacement-blocs" pour ne jamais se toucher meme au niveau
# d'agrandissement maximum. Chaque ile est protegee (casse/pose/coffres/PVP) : seuls le
# proprietaire et ses membres de confiance peuvent y interagir.
#
# monde : nom du monde dedie aux iles (cree automatiquement, vide/void).
# espacement-blocs : distance entre le centre de deux iles consecutives. DOIT rester superieur a
#                     2x taille-max (+ marge) pour qu'aucune ile agrandie au maximum ne puisse en
#                     toucher une autre.
# taille-depart / taille-max : rayon (en blocs, carre) de la zone protegee autour du centre.
# prix-agrandissement / blocs-par-agrandissement : cout en argent (economie interne) pour agrandir
#                                                   le rayon protege de "blocs-par-agrandissement"
#                                                   blocs, jusqu'a taille-max.
# pvp-autorise : si false (par defaut), les degats entre joueurs sont bloques sur toute ile.
# explosions-autorisees : si false (par defaut), TNT/creepers ne detruisent aucun bloc sur les
#                          iles (les fermes a TNT ne fonctionnent pas tant que desactive).
# kit-depart : items donnes au joueur a la creation de son ile. Chaque entree est SOIT "materiel"
#              (item vanilla) SOIT "objet-custom" (id d'un item du module Custom Items), + quantite.
# valeurs-blocs : points de "valeur d'ile" attribues par bloc POSE (retires si casse) : determine
#                 le niveau de l'ile (somme totale). Materiaux absents = 0 point.
# paliers : recompenses AUTOMATIQUES donnees au proprietaire des que la valeur totale de son ile
#           atteint "niveau" (une seule fois par palier). Meme format de recompense que
#           battlepass.yml/quests.yml/luckyblocks.yml (ITEM, ECONOMIE, OBJET_CUSTOM, GENERATEUR,
#           MACHINE, LUCKYBLOCK, PET, BOOST_XP).
# defis : objectifs ponctuels donnant de l'XP BattlePass (+ une recompense optionnelle, meme
#         format que "paliers"), une seule fois par defi et par ile.
#         type : NIVEAU (valeur d'ile atteinte) | MEMBRES (nombre de membres invites atteint) |
#                TAILLE (rayon protege atteint, via /ile upgrade) | BLOCS_POSES (nombre total de
#                blocs poses sur l'ile, quelle que soit leur valeur).
#         id : identifiant unique du defi (libre, utilise uniquement en interne pour le suivi).
# argent-depart : credite au joueur (economie interne) a la creation de son ile.
monde: "iles"
espacement-blocs: 300
spawn-monde:
  x: 0
  y: 100
  z: 0
taille-depart: 10
taille-max: 50
prix-agrandissement: 5000
blocs-par-agrandissement: 5
pvp-autorise: false
explosions-autorisees: false
argent-depart: 500

kit-depart:
  - materiel: OAK_SAPLING
    quantite: 2
  - materiel: WATER_BUCKET
    quantite: 1
  - materiel: LAVA_BUCKET
    quantite: 1
  - materiel: BREAD
    quantite: 8
  - materiel: OAK_LOG
    quantite: 2
  - materiel: STONE_PICKAXE
    quantite: 1
  - materiel: STONE_AXE
    quantite: 1
  - materiel: FISHING_ROD
    quantite: 1
  - materiel: COAL
    quantite: 8
  - materiel: SAND
    quantite: 8
  - materiel: GRAVEL
    quantite: 8
  - objet-custom: carburant_ameliore
    quantite: 1

valeurs-blocs:
  DIAMOND_BLOCK: 50
  EMERALD_BLOCK: 40
  NETHERITE_BLOCK: 100
  GOLD_BLOCK: 20
  IRON_BLOCK: 10
  OBSIDIAN: 5
  COBBLESTONE: 1
  STONE: 1
  DIRT: 0
  GRASS_BLOCK: 0
  OAK_LOG: 1
  OAK_LEAVES: 0

paliers:
  - niveau: 50
    recompense:
      type: ECONOMIE
      montant: 5000
  - niveau: 150
    recompense:
      type: OBJET_CUSTOM
      item-id: carburant_ameliore
      quantite: 5
  - niveau: 400
    recompense:
      type: GENERATEUR
      type-id: fer
      quantite: 1
  - niveau: 800
    recompense:
      type: ECONOMIE
      montant: 50000
  - niveau: 1500
    recompense:
      type: MACHINE
      machine-id: transformation
      quantite: 1

defis:
  - id: premier_bloc
    type: BLOCS_POSES
    objectif: 1
    xp: 20
  - id: premiers_pas
    type: NIVEAU
    objectif: 25
    xp: 100
  - id: bonne_recolte
    type: NIVEAU
    objectif: 250
    xp: 400
  - id: pas_seul
    type: MEMBRES
    objectif: 1
    xp: 50
  - id: petite_communaute
    type: MEMBRES
    objectif: 4
    xp: 300
  - id: premier_agrandissement
    type: TAILLE
    objectif: 20
    xp: 150
  - id: grande_ile
    type: TAILLE
    objectif: 40
    xp: 500
    recompense:
      type: ECONOMIE
      montant: 15000
