# =========================================
#   MysteriaCraft - Configuration des minerais/objets custom
# =========================================
# Chaque minerai custom est visuellement un lingot de fer (item-de-base) redessine par le
# resource pack via son custom-model-data (voir resourcepack/README.md pour l'installer).
# minerais-source : blocs dont la casse a une chance (chance-drop, en %) de donner ce minerai.
#                   Liste vide/absente = pas de source naturelle, uniquement obtenable en
#                   recompense (crate/battlepass/quete/luckyblock via "type: OBJET_CUSTOM").
# prix-vente : 0 = non revendable via /customitem sell.

# Machine a Transformation : un bloc pose (voir /machine give) sur lequel on clique-droit avec
# un minerai vanilla en main. chance-reussite % de le transformer en cle... en Lucky Block de la
# famille indiquee (module LuckyBlock). En cas d'echec, le minerai est simplement perdu.
machine-transformation:
  bloc: IRON_BLOCK
  chance-reussite: 20
  minerais:
    COAL: commune
    RAW_IRON: commune
    IRON_INGOT: commune
    RAW_COPPER: commune
    COPPER_INGOT: commune
    RAW_GOLD: rare
    GOLD_INGOT: rare
    DIAMOND: rare
    EMERALD: rare
    NETHERITE_INGOT: rare

items:
  rubis:
    nom: "&cRubis Brut"
    lore:
      - "&7Une pierre precieuse rougeoyante,"
      - "&7chaude au toucher."
    item-de-base: IRON_INGOT
    custom-model-data: 500001
    minerais-source: [REDSTONE_ORE, DEEPSLATE_REDSTONE_ORE]
    chance-drop: 8
    prix-vente: 40

