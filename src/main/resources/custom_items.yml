# =========================================
#   MysteriaCraft - Configuration des minerais/objets custom
# =========================================
# Chaque minerai/objet custom est visuellement un item vanilla existant (item-de-base) renomme
# et redecrit : AUCUN resource pack requis, tout fonctionne avec le client Minecraft standard.
# minerais-source : blocs dont la casse a une chance (chance-drop, en %) de donner ce minerai.
#                   Liste vide/absente = pas de source naturelle, uniquement obtenable en
#                   recompense (battlepass/quete/luckyblock via "type: OBJET_CUSTOM").
# prix-vente : 0 = non revendable via /customitem sell.
# enchantements : niveau vanilla IGNORE (ex: DAMAGE_ALL: 6 fonctionne). Noms legacy Bukkit :
#                 DAMAGE_ALL (Tranchant), DIG_SPEED (Efficacite), DURABILITY (Solidite),
#                 LOOT_BONUS_BLOCKS (Fortune), LOOT_BONUS_MOBS (Butin), FIRE_ASPECT,
#                 PROTECTION_ENVIRONMENTAL (Protection).
# degats-bonus : bonus de degats d'attaque (armes/outils tenus en main uniquement).
# armure-bonus : bonus d'armure (pieces d'armure uniquement : casque/plastron/jambieres/bottes).
# incassable : si true, l'item ne perd jamais de durabilite.
# vol-de-vie : enchantement custom EXCLUSIF (au-dela des enchantements vanilla renommes ci-dessus) :
#              % des degats infliges en main principale rendus en soin a l'attaquant. 0 = desactive.
# durabilite-custom : nombre d'utilisations (coups portes pour une arme, blocs casses pour un
#                      outil) avant que l'item ne se brise et disparaisse. 0 = desactive (durabilite
#                      vanilla normale uniquement). Reparable a 100% via "kit_reparation" (clic
#                      droit accroupi, kit en main principale + item abime en main secondaire).

# Machine a Transformation : un bloc pose (voir /machine give ou /machine preset) sur lequel on
# clique-droit avec un minerai vanilla en main. CHAQUE minerai insere (1 minerai = 1 charge = 1
# loot, plus de lot de 10) donne TOUJOURS une recompense, jamais rien de perdu. chance-luckyblock
# % du tier actuel (+ bonus d'amelioration, voir "amelioration" ci-dessous) determine seulement SI
# la recompense est le Lucky Block de la famille ciblee (module LuckyBlock) ou, le reste du temps,
# un item custom aleatoire pioche parmi TOUS ceux charges depuis ce fichier (voir "items"), tirage
# equitable entre chacun d'eux.
# tiers : paliers STRUCTURELS de la machine (Bronze/Argent/Or...), chacun avec son propre bloc,
#         sa propre chance-luckyblock de base, son propre cooldown de base et sa propre jauge de
#         carburant affichee. Le PREMIER tier declare est celui donne par /machine give et
#         /machine preset (pas de kit-item-id). Chaque tier SUIVANT necessite le kit-item-id
#         (objet custom, voir "items" ci-dessous) correspondant, utilise en clic-droit sur une
#         machine se trouvant EXACTEMENT au tier precedent (progression sequentielle obligatoire :
#         impossible de sauter du tier Bronze directement au tier Or). Le carburant et le bonus
#         d'amelioration deja accumules sont conserves lors d'un changement de tier.
# carburants : chaque entree est un objet custom (voir "items" ci-dessous) utilisable comme
#              carburant. Clic-droit sur la machine avec l'un d'eux en main la ravitaille :
#              charges = nombre de tentatives ajoutees, cooldown-secondes = delai applique aux
#              PROCHAINES tentatives tant que la machine tourne sur ce type de carburant (un
#              carburant ameliore peut donc a la fois donner plus de charges et reduire l'attente).
# auto-alimentation : si true, coller un coffre/coffre piege/baril/hopper a la machine (n'importe
#                      quelle face) lui permet de piocher automatiquement les minerais acceptes
#                      dedans (1 par cooldown ecoule) sans avoir a cliquer. Avec un seul conteneur
#                      colle, il sert aussi de sortie pour les recompenses obtenues ; avec 2
#                      conteneurs ou plus colles, le 1er (ordre nord/sud/est/ouest/haut/bas) sert
#                      d'entree et le 2eme de sortie, pour separer minerais et recompenses.
# hologramme-segments : nombre de blocs "■" dans la barre de progression du cooldown affichee sur
#                        l'hologramme et en actionbar (10 par defaut).
# hologramme-jauge-carburant-max : valeur PAR DEFAUT (utilisee si un tier ne definit pas la sienne)
#                                   de niveau de carburant correspondant a une jauge pleine sur
#                                   l'hologramme (purement visuel, ne limite pas le stock reel).
# hologramme-compact : si true, l'hologramme n'affiche que l'essentiel (barre de cooldown + %
#                       chance-luckyblock), sans le nom/tier de la machine ni le detail carburant/entree-sortie.
machine-transformation:
  hologramme-jauge-carburant-max: 20
  tiers:
    bronze:
      nom: "&7Bronze"
      bloc: IRON_BLOCK
      chance-luckyblock: 20
      cooldown-secondes: 60
      jauge-carburant-max: 20
    argent:
      nom: "&fArgent"
      bloc: GOLD_BLOCK
      chance-luckyblock: 30
      cooldown-secondes: 45
      jauge-carburant-max: 35
      kit-item-id: kit_argent
    or:
      nom: "&6&lOr"
      bloc: DIAMOND_BLOCK
      chance-luckyblock: 45
      cooldown-secondes: 30
      jauge-carburant-max: 50
      kit-item-id: kit_or
    mythique:
      nom: "&d&lMythique"
      bloc: BEACON
      chance-luckyblock: 60
      cooldown-secondes: 20
      jauge-carburant-max: 75
      kit-item-id: kit_mythique
  auto-alimentation: true
  hologramme-segments: 10
  hologramme-compact: false
  # Bonus de chance-luckyblock TEMPORAIRE qui s'accumule a chaque Lucky Block obtenu CONSECUTIF sur
  # une machine (remis a 0 des qu'un item custom sort a la place) : recompense les series de gros
  # gains sans etre permanent. bonus-par-succes: 0 (ou section absente) desactive completement le systeme.
  streak:
    bonus-par-succes: 2
    bonus-max: 20
  # Systeme de pity : nombre d'echanges CONSECUTIFS d'un joueur (toutes ses machines confondues,
  # clic-droit uniquement, pas l'auto-alimentation) sans obtenir de Lucky Block avant que le
  # PROCHAIN echange ne soit garanti Lucky Block. Visible via /machine stats. 0 = desactive.
  pity-seuil: 25
  carburants:
    carburant:
      charges: 5
      cooldown-secondes: 5
    carburant_ameliore:
      charges: 12
      cooldown-secondes: 5
    carburant_legendaire:
      charges: 25
      cooldown-secondes: 1
  # Objet consommable (obtenable-en-recompense-uniquement) qui, en clic-droit (pas besoin de viser
  # une machine), active pour le joueur X secondes durant lesquelles TOUTES ses transformations
  # manuelles (clic-droit) sont gratuites : plus de consommation de charge ni de blocage "sans carburant".
  # Ne s'applique PAS a l'auto-alimentation (qui n'a pas de joueur associe a une machine posee).
  boost-carburant-illimite:
    item-id: carburant_illimite
    duree-secondes: 86400
  # Amelioration de machine : objet custom consommable qui augmente durablement la chance-luckyblock
  # d'UNE machine (stockee sur son bloc), jusqu'a bonus-max.
  amelioration:
    item-id: amelioration_machine
    bonus-par-amelioration: 5
    bonus-max: 30
  # Poids de tirage du loot ALEATOIRE de la machine (obtenu quand le Lucky Block cible n'est PAS
  # obtenu, voir MachineService#pickRandomLoot) : plus un poids est eleve, plus cette entree a de
  # chances de sortir parmi TOUS les items custom + TOUS les generateurs + les 2 Machines
  # elles-memes. poids-defaut s'applique a toute entree ABSENTE des 3 listes ci-dessous (pas besoin
  # de lister les ~60 entrees possibles : seules celles dont la rarete doit differer du defaut ont
  # besoin d'une ligne). poids-machines utilise les cles "transformation"/"miniere".
  # poids-generateurs-lb utilise les ids de famille de Lucky Block (voir luckyblocks.yml) : chaque
  # famille peut donner un Generateur de Lucky Block cible sur elle (voir luckyblock_generateur.yml).
  poids-loot:
    poids-defaut: 10
    poids-items:
      # Items reward-only (jamais craftables) : les plus rares du pool.
      jade: 1
      epee_legendaire_dragon: 1
      pioche_celeste: 1
      hache_titan: 1
      armure_immortelle_casque: 1
      armure_immortelle_plastron: 1
      armure_immortelle_jambieres: 1
      armure_immortelle_bottes: 1
      # Haut de gamme craftable/reward.
      carburant_legendaire: 3
      carburant_illimite: 3
      kit_mythique: 3
      epee_du_vide: 3
      pioche_du_gouffre: 3
      # Tier intermediaire haut (paladin, tier 3 d'equipement, boosts...).
      epee_spectrale: 5
      hache_demolisseur: 5
      armure_paladin_casque: 5
      armure_paladin_plastron: 5
      armure_paladin_jambieres: 5
      armure_paladin_bottes: 5
      kit_or: 5
      amelioration_machine: 5
      boost_generateur: 5
      boost_stockage_generateur: 5
      boost_generateur_lb: 5
      boost_stockage_generateur_lb: 5
      essence_enchantement: 5
      carburant_minier_ameliore: 5
      peridot: 5
      # Legerement au-dessus du defaut (valeur moyenne-haute).
      kit_argent: 7
      epee_guerrier: 7
      pioche_expert: 7
    poids-generateurs:
      fer: 20
      or: 12
      diamant: 6
      legendaire: 1
      ressource_fer: 20
      ressource_or: 12
      ressource_diamant: 5
      ressource_legendaire: 1
      ressource_essence: 8
    poids-generateurs-lb:
      commune: 15
      rare: 8
      epique: 4
      legendaire: 1
    poids-machines:
      transformation: 1
      miniere: 1
  # ORDRE DE PRIORITE pour l'auto-alimentation : quand plusieurs minerais acceptes sont presents
  # dans le coffre d'entree, celui declare EN PREMIER ici est traite en premier (peu importe sa
  # case dans le coffre). Range ici du plus rare au plus commun pour prioriser les gros gains.
  # La valeur associee a chaque minerai est l'id de la famille de Lucky Block obtenue en echange
  # (voir luckyblocks.yml) : un nouveau Lucky Block n'a donc besoin QUE d'une nouvelle ligne ici,
  # aucun changement de code n'est necessaire pour qu'il fonctionne avec la machine.
  minerais:
    # legendaire
    NETHERITE_INGOT: legendaire
    NETHERITE_SCRAP: legendaire
    ANCIENT_DEBRIS: legendaire
    # epique
    DIAMOND: epique
    EMERALD: epique
    # rare
    GOLD_INGOT: rare
    RAW_GOLD: rare
    LAPIS_LAZULI: rare
    AMETHYST_SHARD: rare
    # commune
    IRON_INGOT: commune
    RAW_IRON: commune
    COPPER_INGOT: commune
    RAW_COPPER: commune
    COAL: commune
    REDSTONE: commune
    QUARTZ: commune

