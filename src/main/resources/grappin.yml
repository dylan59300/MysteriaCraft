# =========================================
#   MysteriaCraft - Configuration du Grappin
# =========================================
# Clic-droit avec le Grappin en main (dans le vide ou sur un bloc) projette le joueur vers le
# premier bloc touche par sa ligne de mire, dans la limite de distance-max.
