# =========================================
#   MysteriaCraft - Configuration du BattlePass
# =========================================
# Saison permanente : pas de date de fin, la progression n'est jamais reinitialisee.
# xp-requis est CUMULATIF (xp totale necessaire depuis le debut pour atteindre ce palier).
# gratuit / premium : ITEM (materiel + quantite) ou ECONOMIE (montant). Laisser absent = pas de recompense sur cette piste.
# Tant que les Quetes ne sont pas branchees dessus, l'xp est gagnee passivement (xp-par-minute-de-jeu)
# et via /battlepassadmin addxp <joueur> <montant> (admin).

