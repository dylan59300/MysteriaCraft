# =========================================
#   MysteriaCraft - Configuration du/des PNJ Marchand(s)
# =========================================
# Chaque PNJ Marchand s'invoque en clic-droit sur un bloc avec SON item custom "oeuf-id" (voir
# custom_items.yml) en main. Une fois invoque, il est invulnerable, immobile et persiste au
# redemarrage du serveur (comme n'importe quelle entite normale du monde). Clic-droit dessus
# ouvre son menu d'echange.
#
# drop-passif : petite chance d'obtenir des pieces d'echange en minant ou en tuant un mob, pour
#               ne pas dependre uniquement du craft. 0 = desactive.
#
# Pour chaque marchand (cle sous "marchands") :
#   oeuf-id : id de l'item custom qui invoque CE marchand precis.
#   id-piece : id de l'item custom utilise comme monnaie pour CE marchand.
#   nom-pnj : nom affiche au-dessus du PNJ.
#   offres-actives-par-jour : si > 0, seules N offres (tirees au hasard, MEME tirage pour tous les
#                             joueurs, renouvele chaque jour) parmi "offres" sont proposees ce
#                             jour-la. 0 = toutes les offres sont toujours proposees.
#   fidelite : reduction progressive sur TOUTES les offres de ce marchand, basee sur le nombre
#              total d'echanges DEJA effectues avec lui (tous historique confondu) :
#              reduction = min(reduction-max, (total / seuil) * reduction-pourcent), en %.
#   offres : chaque entree coute "cout" pieces d'echange (avant reduction fidelite, retirees de
#            l'inventaire du joueur, meme reparties sur plusieurs piles) contre la "recompense"
#            (n'importe quel type de Reward : ITEM, ECONOMIE, OBJET_CUSTOM, GENERATEUR, MACHINE,
#            AGRANDISSEMENT_ILE, TITRE_CHAT...). limite-periode (JOUR/SEMAINE/absent) + limite-
#            quantite : nombre maximum d'achats de CETTE offre par joueur sur la periode donnee.
#   rachats : le SENS INVERSE des offres (accessible via le bouton "Vendre des ressources" du menu
#             du marchand) : le joueur donne "quantite" exemplaires de "materiel" (materiau
#             vanilla) et recoit en echange la "recompense", pour ecouler un surplus de ressources
#             (ex : les lingots/gemmes produits par les Generateurs de Ressources, voir
#             generateurs.yml). Memes regles de limite-periode/limite-quantite que les offres.

drop-passif:
  item-id: piece_echange
  chance-minage: 1.5
  chance-mob: 2.0
  quantite: 1

marchands:
  marchand:
    oeuf-id: oeuf_pnj_marchand
    id-piece: piece_echange
    nom-pnj: "&6&lMarchand"
    offres-actives-par-jour: 4
    fidelite:
      seuil: 10
      reduction-pourcent: 5
      reduction-max: 30
    offres:
      fer_rapide:
        cout: 5
        limite-periode: JOUR
        limite-quantite: 3
        recompense:
          type: GENERATEUR
          type-id: fer
          quantite: 1

      carburant_ameliore_lot:
        cout: 8
        limite-periode: JOUR
        limite-quantite: 2
        recompense:
          type: OBJET_CUSTOM
          item-id: carburant_ameliore
          quantite: 5

      machine_transformation:
        cout: 25
        limite-periode: SEMAINE
        limite-quantite: 1
        recompense:
          type: MACHINE
          machine-id: transformation
          quantite: 1

      machine_miniere:
        cout: 40
        limite-periode: SEMAINE
        limite-quantite: 1
        recompense:
          type: MACHINE
          machine-id: miniere
          quantite: 1

      agrandissement_ile:
        cout: 15
        limite-periode: SEMAINE
        limite-quantite: 2
        recompense:
          type: AGRANDISSEMENT_ILE
          blocs: 10
          nom: "&aAgrandissement d'ile (+10 blocs)"

      boost_xp:
        cout: 6
        limite-periode: JOUR
        limite-quantite: 3
        recompense:
          type: BOOST_XP
          duree-secondes: 1800
          multiplicateur: 2.0

      economie_lot:
        cout: 3
        recompense:
          type: ECONOMIE
          montant: 500

    # Rachat du surplus des Generateurs de Ressources (voir generateurs.yml : ressource_fer,
    # ressource_or, ressource_diamant) contre des pieces d'echange.
    rachats:
      vendre_fer:
        materiel: IRON_INGOT
        quantite: 16
        recompense:
          type: OBJET_CUSTOM
          item-id: piece_echange
          quantite: 1

      vendre_or:
        materiel: GOLD_INGOT
        quantite: 8
        recompense:
          type: OBJET_CUSTOM
          item-id: piece_echange
          quantite: 1

      vendre_diamant:
        materiel: DIAMOND
        quantite: 2
        limite-periode: JOUR
        limite-quantite: 10
        recompense:
          type: OBJET_CUSTOM
          item-id: piece_echange
          quantite: 1

  # Deuxieme marchand (voir "idee #1") : specialise equipement/objets custom, propose TOUJOURS
  # toutes ses offres (pas de rotation), invoque via un item custom distinct.
  forgeron:
    oeuf-id: oeuf_pnj_forgeron
    id-piece: piece_echange
    nom-pnj: "&7&l&nForgeron"
    offres-actives-par-jour: 0
    fidelite:
      seuil: 8
      reduction-pourcent: 5
      reduction-max: 25
    offres:
      pioche_expert:
        cout: 20
        limite-periode: SEMAINE
        limite-quantite: 1
        recompense:
          type: OBJET_CUSTOM
          item-id: pioche_expert
          quantite: 1

      epee_guerrier:
        cout: 20
        limite-periode: SEMAINE
        limite-quantite: 1
        recompense:
          type: OBJET_CUSTOM
          item-id: epee_guerrier
          quantite: 1

      kit_reparation_lot:
        cout: 4
        limite-periode: JOUR
        limite-quantite: 5
        recompense:
          type: OBJET_CUSTOM
          item-id: kit_reparation
          quantite: 1
