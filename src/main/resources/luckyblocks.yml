# =========================================
#   MysteriaCraft - Configuration des Lucky Blocks
# =========================================
# A la casse, le jeu tire d'abord BON ou MAUVAIS selon "chance-bonne-base" (50% par defaut) plus
# l'eventuel bonus de minerais places a cote du bloc (voir bonus-minerais ci-dessous), puis tire
# un effet precis au poids ("chance") au sein du pool correspondant (BON ou MAUVAIS).
#
# cooldown-secondes : delai avant de pouvoir re-declencher un effet sur CETTE famille (par joueur).
# prix-achat : 0 = pas achetable directement via /luckyblock buy (uniquement craft ou recompense).
# chance-bonne-base : % de chance d'un effet BON avant bonus de minerais (50 par defaut).
# recette : ingredients d'un craft shapeless (n'importe quel agencement dans la table).
#
# effets[].type : BON | MAUVAIS
# effets[].recompense (si BON) : ITEM, ECONOMIE, BOOST_XP, PET, LUCKYBLOCK,
#                                 OBJET_CUSTOM ou GENERATEUR (meme format que
#                                 battlepass.yml/quests.yml).
# effets[].action (si MAUVAIS) : TNT | MOBS | POTION | FOUDRE
#
# effets-communs-bons : pool d'effets BONS fusionne automatiquement dans LE POOL BON DE CHAQUE
#                       FAMILLE (commune, rare, epique, legendaire, et toute famille ajoutee plus
#                       tard) EN PLUS de ses propres effets "effets:". Pas besoin de dupliquer ce
#                       loot dans chaque famille a la main. Meme format qu'un effet BON de famille.
effets-communs-bons:
  - type: BON
    chance: 25
    recompense:
      type: ITEM
      materiel: GOLDEN_APPLE
      quantite: 48
