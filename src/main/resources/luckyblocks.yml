# =========================================
#   MysteriaCraft - Configuration des Lucky Blocks
# =========================================
# A la casse, le jeu tire d'abord BON ou MAUVAIS selon "chance-bonne-base" (50% par defaut) plus
# l'eventuel bonus de minerais places a cote du bloc (voir bonus-minerais ci-dessous), puis tire
# un effet precis au poids ("chance") au sein du pool correspondant (BON ou MAUVAIS).
#
# cooldown-secondes : delai avant de pouvoir re-declencher un effet sur CETTE famille (par joueur).
# prix-achat : 0 = pas achetable directement via /luckyblock buy (uniquement craft ou recompense).
# chance-bonne-base : % de chance d'un effet BON avant bonus de minerais (50 par defaut).
# recette : ingredients d'un craft shapeless (n'importe quel agencement dans la table).
#
# effets[].type : BON | MAUVAIS
# effets[].recompense (si BON) : ITEM, ECONOMIE, CLE_CAISSE, BOOST_XP, PET, LUCKYBLOCK,
#                                 OBJET_CUSTOM ou GENERATEUR (meme format que
#                                 crates.yml/battlepass.yml/quests.yml).
# effets[].action (si MAUVAIS) : TNT | MOBS | POTION | FOUDRE

# Bonus de minerais : placer un de ces blocs contre un Lucky Block (ou l'inverse) augmente sa
# chance d'effet BON du pourcentage indique, jusqu'a bonus-minerais-max cumule (par bloc).
bonus-minerais-max: 45
bonus-minerais:
  COAL_ORE: 2
  DEEPSLATE_COAL_ORE: 2
  IRON_ORE: 5
  DEEPSLATE_IRON_ORE: 5
  GOLD_ORE: 8
  DEEPSLATE_GOLD_ORE: 8
  NETHER_GOLD_ORE: 6
  REDSTONE_ORE: 4
  DEEPSLATE_REDSTONE_ORE: 4
  LAPIS_ORE: 4
  DEEPSLATE_LAPIS_ORE: 4
  NETHER_QUARTZ_ORE: 3
  DIAMOND_ORE: 15
  DEEPSLATE_DIAMOND_ORE: 15
  EMERALD_ORE: 12
  DEEPSLATE_EMERALD_ORE: 12
  ANCIENT_DEBRIS: 25

familles:
  commune:
    nom: "&6Lucky Block Commun"
    materiel: GOLD_BLOCK
    ordre: 1
    cooldown-secondes: 30
    prix-achat: 300
    chance-bonne-base: 50
    recette:
      - materiel: GOLD_BLOCK
        quantite: 1
      - materiel: RABBIT_FOOT
        quantite: 1
    effets:
      - type: BON
        chance: 45
        recompense:
          type: ECONOMIE
          montant: 100
      - type: BON
        chance: 30
        recompense:
          type: ITEM
          materiel: DIAMOND
          quantite: 2
      - type: BON
        chance: 25
        recompense:
          type: CLE_CAISSE
          caisse: commune
          quantite: 1
      - type: MAUVAIS
        chance: 55
        action: TNT
        quantite: 1
      - type: MAUVAIS
        chance: 45
        action: MOBS
        mob: ZOMBIE
        quantite: 3

  rare:
    nom: "&b&lLucky Block Rare"
    materiel: DIAMOND_BLOCK
    ordre: 2
    cooldown-secondes: 90
    prix-achat: 2000
    chance-bonne-base: 50
    recette:
      - materiel: DIAMOND_BLOCK
        quantite: 1
      - materiel: RABBIT_FOOT
        quantite: 1
      - materiel: GOLDEN_APPLE
        quantite: 1
    effets:
      - type: BON
        chance: 40
        recompense:
          type: CLE_CAISSE
          caisse: legendaire
          quantite: 1
      - type: BON
        chance: 30
        recompense:
          type: BOOST_XP
          duree-secondes: 900
          multiplicateur: 3.0
      - type: BON
        chance: 30
        recompense:
          type: ECONOMIE
          montant: 1000
      - type: MAUVAIS
        chance: 60
        action: POTION
        effet-potion: POISON
        duree-secondes: 10
        amplificateur: 1
      - type: MAUVAIS
        chance: 40
        action: FOUDRE
