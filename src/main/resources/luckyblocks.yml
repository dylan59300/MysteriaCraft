  - type: BON
    chance: 15
    recompense:
      type: ITEM
      materiel: IRON_BLOCK
      quantite: 256
  - type: BON
    chance: 8
    recompense:
      type: ITEM
      materiel: IRON_BLOCK
      quantite: 384
  - type: BON
    chance: 10
    recompense:
      type: ITEM
      materiel: DIAMOND_BLOCK
