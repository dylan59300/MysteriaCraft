# =========================================
#   MysteriaCraft - Configuration des Lucky Blocks
# =========================================
# A la casse, le jeu tire d'abord BON ou MAUVAIS selon "chance-bonne-base" (50% par defaut) plus
# l'eventuel bonus de minerais places a cote du bloc (voir bonus-minerais ci-dessous), puis tire
# un effet precis au poids ("chance") au sein du pool correspondant (BON ou MAUVAIS). Aucun
# cooldown : un Lucky Block se recasse immediatement. Tous les mauvais loot ont ete retires : seuls
# des effets BON sont configures ci-dessous, donc chaque casse donne toujours une recompense.
#
# prix-achat : 0 = pas achetable directement via /luckyblock buy (uniquement craft ou recompense).
# chance-bonne-base : % de chance d'un effet BON avant bonus de minerais (50 par defaut).
# recette : ingredients d'un craft shapeless (n'importe quel agencement dans la table).
# actif-du / actif-au : DEUX cles optionnelles (format "MM-jj", ex: "10-20") qui rendent une
#                       famille SAISONNIERE (Halloween, Noel...) : n'apparait dans le GUI/shop et
#                       n'est craftable QUE durant cette periode (gere le passage du nouvel an,
#                       ex: "12-15" -> "01-05"). Absentes des deux cotes = famille permanente
#                       (comportement normal). Hors periode, elle reste donnable/cassable via
#                       /luckyblockadmin give ou en recompense ; relancez /luckyblockadmin reload
#                       le jour du changement pour que le craft/GUI se mette a jour immediatement.
#
# effets[].type : BON | MAUVAIS
# effets[].recompense (si BON) : ITEM, ECONOMIE, BOOST_XP, PET, LUCKYBLOCK,
#                                 OBJET_CUSTOM, GENERATEUR ou MACHINE (meme format que
#                                 battlepass.yml/quests.yml).
# effets[].action (si MAUVAIS) : TNT | MOBS | POTION | FOUDRE
#
# pity-seuil : nombre de casses CONSECUTIVES d'un joueur sur UNE MEME famille sans obtenir d'effet
#              marque "pity: true" avant que la prochaine casse ne soit GARANTIE parmi ces effets
#              pity de cette famille (visible en jeu : clic droit sur un Lucky Block en main ->
#              GUI des chances). 0 = systeme desactive. Le compteur repart a 0 des qu'un effet pity
#              sort (force ou naturellement). Marquez "pity: true" sur les effets BON les plus rares
#              d'une famille (voir effets-communs-bons et les familles ci-dessous) pour les inclure.
pity-seuil: 40
#
# effets-communs-bons : pool d'effets BONS fusionne automatiquement dans LE POOL BON DE CHAQUE
#                       FAMILLE (commune, rare, epique, legendaire, et toute famille ajoutee plus
#                       tard) EN PLUS de ses propres effets "effets:". Pas besoin de dupliquer ce
#                       loot dans chaque famille a la main. Meme format qu'un effet BON de famille.
effets-communs-bons:
  - type: BON
    chance: 25
    recompense:
      type: ITEM
      materiel: GOLDEN_APPLE
      quantite: 48
  - type: BON
    chance: 20
    recompense:
