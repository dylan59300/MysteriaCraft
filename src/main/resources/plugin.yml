name: MysteriaCraft
version: '${project.version}'
main: com.mysteriacraft.MysteriaCraft
api-version: '1.20'
author: dylan59300
description: Plugin serveur - Crates, Economie, Kits, BattlePass, Quetes, Pets, LuckyBlock, Custom Items

commands:
  balance:
    description: Affiche votre solde ou celui d'un joueur
    usage: /<command> [joueur]
    aliases: [bal, argent]
  pay:
    description: Envoie de l'argent a un autre joueur
    usage: /<command> <joueur> <montant>
  payconfirm:
    description: Confirme un paiement en attente (montant superieur au seuil configure)
    usage: /<command>
  baltop:
    description: Classement des joueurs les plus riches
    usage: /<command> [page]
  eco:
    description: Commande admin pour gerer l'economie
    usage: /<command> <give|take|set|reset> <joueur> [montant]
    permission: mysteriacraft.eco.admin
  ecoreload:
    description: Recharge la configuration et les messages du plugin
    usage: /<command>
    permission: mysteriacraft.eco.admin
  kit:
    description: Ouvre le menu des kits, reclame un kit precis, ou /kit reset <joueur> <kit> (admin)
    usage: /<command> [nom-du-kit]
  kitreload:
    description: Recharge kits.yml
    usage: /<command>
    permission: mysteriacraft.kit.admin
  crate:
    description: Ouvre le menu des caisses, ouvre directement une caisse, ou /crate preview <caisse>
    usage: /<command> [nom-caisse|preview <nom-caisse>]
  cratekey:
    description: Gere les cles virtuelles d'un joueur pour une caisse
    usage: /<command> <give|take|set> <joueur> <caisse> <quantite>
    permission: mysteriacraft.crate.admin
  cratereload:
    description: Recharge crates.yml
    usage: /<command>
    permission: mysteriacraft.crate.admin
  battlepass:
    description: Ouvre le menu du BattlePass (saison permanente)
    usage: /<command>
  battlepassadmin:
    description: Gere le BattlePass (addxp, reload)
    usage: /<command> <addxp <joueur> <montant>|reload>
    permission: mysteriacraft.battlepass.admin
  battlepassconfirmpremium:
    description: Confirme l'achat en attente du Pass Premium
    usage: /<command>
  quests:
    description: Ouvre le menu des quetes quotidiennes et hebdomadaires
    usage: /<command>
  questsadmin:
    description: Recharge quests.yml ou reinitialise la progression d'un joueur
    usage: /<command> [reset <joueur>]
    permission: mysteriacraft.quests.admin
  pets:
    description: Ouvre le menu des pets (achat, invocation)
    usage: /<command>
  petsadmin:
    description: Recharge pets.yml
    usage: /<command>
    permission: mysteriacraft.pets.admin
  luckyblock:
    description: Ouvre le menu des Lucky Blocks, ou achete directement avec buy
    usage: /<command> [buy <famille> [quantite]]
  luckyblockadmin:
    description: Donne un Lucky Block a un joueur ou recharge luckyblocks.yml
    usage: /<command> <give <joueur> <famille> [quantite]|reload>
    permission: mysteriacraft.luckyblock.admin
  customitem:
    description: Gere les minerais/objets custom (give admin, sell, reload admin)
    usage: /<command> <give <joueur> <id> [quantite]|sell <id>|reload>
  machine:
    description: Donne la Machine a Transformation ou recharge sa config (admin)
    usage: /<command> <give <joueur> [quantite]|reload>
    permission: mysteriacraft.machine.admin
  generateur:
    description: Donne un Generateur d'Argent ou recharge sa config (admin)
    usage: /<command> <give <joueur> <fer|or|diamant> [quantite]|reload>
    permission: mysteriacraft.generateur.admin

permissions:
  mysteriacraft.eco.admin:
    description: Autorise la gestion admin de l'economie
    default: op
  mysteriacraft.kit.admin:
    description: Autorise la gestion admin des kits (reload, reset de cooldown)
    default: op
  mysteriacraft.kit.starter:
    description: Donne acces au kit Debutant
    default: true
  mysteriacraft.kit.guerrier:
    description: Donne acces au kit Guerrier
    default: true
  mysteriacraft.kit.vip:
    description: Donne acces au kit VIP
    default: false
  mysteriacraft.kit.cooldown.vip:
    description: Reduit le cooldown des kits pour les VIP (voir cooldown-permissions dans kits.yml)
    default: false
  mysteriacraft.crate.admin:
    description: Autorise la gestion admin des caisses (cles, reload)
    default: op
  mysteriacraft.battlepass.admin:
    description: Autorise la gestion admin du BattlePass (xp, reload)
    default: op
  mysteriacraft.battlepass.premium:
    description: Accorde le Pass Premium sans achat (a lier a un rang ou un kit VIP)
    default: false
  mysteriacraft.quests.admin:
    description: Autorise la gestion admin des quetes (reload)
    default: op
  mysteriacraft.pets.admin:
    description: Autorise la gestion admin des pets (reload)
    default: op
  mysteriacraft.luckyblock.admin:
    description: Autorise la gestion admin des Lucky Blocks (give, reload)
    default: op
  mysteriacraft.customitem.admin:
    description: Autorise la gestion admin des items custom (give, reload)
    default: op
  mysteriacraft.machine.admin:
    description: Autorise la gestion admin de la Machine a Transformation (give, reload)
    default: op
  mysteriacraft.generateur.admin:
    description: Autorise la gestion admin des Generateurs d'Argent (give, reload)
    default: op
