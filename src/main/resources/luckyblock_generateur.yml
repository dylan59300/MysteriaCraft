# =========================================
#   MysteriaCraft - Configuration du Generateur de Lucky Block
# =========================================
# Un bloc pose (voir /generateurlb give <joueur> <famille> [quantite], ou craft pour la version
# "famille-craft") qui, tant qu'il lui reste du carburant, produit AUTOMATIQUEMENT un Lucky Block
# de la famille choisie a sa creation toutes les "intervalle-secondes" secondes, en temps REEL
# (meme hors-ligne, comme les Generateurs d'argent/ressources). Les Lucky Blocks produits sont
# deposes dans un coffre/coffre piege/baril/hopper colle au generateur (n'importe quelle face), ou
# au sol a son pied si aucun conteneur n'est colle. Clic-droit avec du carburant en main pour
# l'alimenter ; clic a vide pour voir son etat (famille, carburant restant).
#
# bloc : materiau visuel du bloc pose.
# intervalle-secondes : temps entre 2 Lucky Blocks produits (tant qu'il reste du carburant).
# carburants : chaque entree est un objet custom (voir custom_items.yml) utilisable comme
#              carburant. "production" = nombre de Lucky Blocks que ce carburant permet de produire.
# recette : craft shapeless, produit UNIQUEMENT la version "famille-craft" (les autres familles
#           s'obtiennent via /generateurlb give ou en recompense) : le rythme de production etant
#           le meme quelle que soit la famille, seul un admin doit pouvoir distribuer les familles
#           les plus chargees (rare/epique/legendaire).
# famille-craft : id de la famille de Lucky Block (voir luckyblocks.yml) produite par le craft.
# max-generateurs-par-joueur : 0 = illimite. Limitation connue : le comptage ne suit que les
#                               generateurs vus depuis le dernier demarrage du plugin (comme les
#                               autres effets ambiants de MysteriaCraft).
generateur-luckyblock:
  bloc: BEACON
  intervalle-secondes: 300
  famille-craft: commune
  max-generateurs-par-joueur: 3
  carburants:
    carburant_generateur_lb:
      production: 1
    carburant_generateur_lb_ameliore:
      production: 5
  recette:
    - materiel: BEACON
      quantite: 1
    - materiel: GOLD_BLOCK
      quantite: 4
    - materiel: RABBIT_FOOT
      quantite: 2
