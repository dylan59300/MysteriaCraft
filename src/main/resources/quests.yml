# =========================================
#   MysteriaCraft - Configuration des Quetes
# =========================================
# Reset automatique : la progression est suivie par periode (jour ou semaine ISO courante).
# Des qu'un nouveau jour/semaine commence, la progression repart de zero, sans tache a programmer.
# type : BREAK_BLOCK | PLACE_BLOCK | KILL_MOB | FISH
# cible : materiau (BREAK_BLOCK/PLACE_BLOCK) ou type d'entite (KILL_MOB). Absent = tout compte (FISH).
# xp : ajoutee automatiquement au BattlePass a la completion.
# recompense : ITEM ou ECONOMIE, donnee automatiquement a la completion (optionnel).

quotidiennes:
  casser_pierre:
    nom: "&7Casser de la pierre"
    icone: STONE
    type: BREAK_BLOCK
    cible: STONE
    objectif: 64
    xp: 50
    recompense:
      type: ECONOMIE
      montant: 20

  tuer_zombies:
    nom: "&2Tuer des zombies"
    icone: ZOMBIE_HEAD
    type: KILL_MOB
    cible: ZOMBIE
    objectif: 10
    xp: 80
    recompense:
      type: ITEM
      materiel: COOKED_BEEF
      quantite: 8

  planter_bois:
    nom: "&6Recolter du bois"
    icone: OAK_LOG
    type: BREAK_BLOCK
    cible: OAK_LOG
    objectif: 32
    xp: 40
    recompense:
      type: ECONOMIE
      montant: 15

